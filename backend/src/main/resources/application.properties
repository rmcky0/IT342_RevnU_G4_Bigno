# Database (Fallback to local Postgres if Supabase isn't found)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (Supabase free tier: 15 session-mode slots)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:missing-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:missing-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# App URLs
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT (Provided a long fallback string so the JWT encoder doesn't crash)
app.jwt.secret=${JWT_SECRET:this-is-a-fallback-secret-key-that-must-be-very-long-to-work}
app.jwt.expiration-ms=${JWT_EXPIRATION:1800000}
app.jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

spring.jackson.time-zone=Asia/Manila
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/api/v1

# Email (Resend)
resend.api-key=${RESEND_API_KEY:missing-key}
resend.from-address=${RESEND_FROM:RevnU Team <onboarding@resend.dev>}

# Admin Setup
app.default-admin.email=${ADMIN_EMAIL:admin@revnu.com}
app.default-admin.password=${ADMIN_PASS:Admin@1234!}

# External APIs
external.api.ph-holidays.url=https://calendarific.com/api/v2/holidays
external.api.ph-holidays.key=${HOLIDAY_API_KEY:missing-key}

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
supabase.key=${SUPABASE_KEY:missing-key}
supabase.storage.bucket=revnu_files
# Database (Fallback to local Postgres if Supabase isn't found)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:missing-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:missing-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# App URLs
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT (Provided a long fallback string so the JWT encoder doesn't crash)
app.jwt.secret=${JWT_SECRET:this-is-a-fallback-secret-key-that-must-be-very-long-to-work}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

server.address=0.0.0.0
server.port=8080

# Email Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:missing@email.com}
spring.mail.password=${SMTP_PASS:missing-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin Setup
app.default-admin.email=${ADMIN_EMAIL:admin@revnu.com}
app.default-admin.password=${ADMIN_PASS:Admin@1234!}

# External APIs
external.api.ph-holidays.url=https://calendarific.com/api/v2/holidays
external.api.ph-holidays.key=${HOLIDAY_API_KEY:missing-key}

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
supabase.key=${SUPABASE_KEY:missing-key}
supabase.storage.bucket=revnu_files